[project]
name = "doom-env"
version = "1.0.0.dev0"
description = "Official ViZDoom Gymnasium wrapper for DevForge 'Can It Play DOOM?' (shared contract with the scorer)"
requires-python = ">=3.13"
dependencies = [
    "vizdoom==1.3.3",
    "gymnasium>=1.0",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doom_env"]
