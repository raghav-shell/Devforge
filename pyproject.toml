[project]
name = "devforge-doom-template"
version = "0.1.0"
description = "Starter template for DevForge 'Can It Play DOOM?' (Yugaantar 2026)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "doom-env",
    "vizdoom==1.3.3",
    "gymnasium>=1.0",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "tensorboard==2.21.0",
    "torch==2.15.0",
]

[tool.uv.sources]
doom-env = { path = "env", editable = true }

[tool.pytest.ini_options]
# `doom_agent` is imported top-level, exactly as the scorer does (submission/ on sys.path).
pythonpath = ["submission", "."]
